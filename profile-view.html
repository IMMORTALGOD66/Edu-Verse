<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduVerse | My Growth Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="profile-view.css">
</head>

<body class="bg-dark-navy text-slate-300 min-h-screen font-sans">

    <header class="p-4 border-b border-slate-800 bg-dark-navy/50 backdrop-blur-md sticky top-0 z-50">
        <nav class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-primary font-black text-xl tracking-tighter">EDUVERSE</a>
            <button onclick="logout()" class="text-xs font-bold text-slate-500 hover:text-red-400 uppercase tracking-widest">Logout</button>
        </nav>
    </header>

    <main class="max-w-4xl mx-auto p-6">
        <div class="mb-10">
            <h1 class="text-4xl font-bold text-white mb-2">Welcome back, <span id="display-name" class="text-primary">Explorer</span>!</h1>
            <p class="text-slate-400">Class <span id="display-grade">--</span> | Your character development journey continues.</p>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
            <div class="stat-card">
                <div class="flex justify-between mb-4">
                    <h3 class="font-bold text-white uppercase tracking-wider">Self-Discipline</h3>
                    <span class="text-primary font-mono">LVL 1</span>
                </div>
                <div class="progress-bar mb-2">
                    <div class="progress-fill" style="width: 35%;"></div>
                </div>
                <p class="text-xs text-slate-500">Complete daily focus tasks to increase.</p>
            </div>

            <div class="stat-card">
                <div class="flex justify-between mb-4">
                    <h3 class="font-bold text-white uppercase tracking-wider">Resilience</h3>
                    <span class="text-secondary font-mono">LVL 1</span>
                </div>
                <div class="progress-bar mb-2">
                    <div class="progress-fill" style="width: 20%;"></div>
                </div>
                <p class="text-xs text-slate-500">Earned by attempting difficult challenges.</p>
            </div>
        </div>
    </main>

    <script src="profile-view.js"></script>
</body>
</html>
