<!DOCTYPE html>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>

            theme: {
                extend: {
                    colors: {
                        'space-dark': '#0f1829',
                        'space-light': '#1d2a40',
                        'edu-primary': '#00d9ff',
                        'edu-secondary': '#a855f7',
                        'edu-accent': '#fbbf24',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },

            }
        }
    </script>

    <link rel="stylesheet" href="style.css">

<body class="bg-space-dark text-slate-200 antialiased">

    <header class="sticky top-0 z-50 bg-space-dark/95 backdrop-blur-sm border-b border-white/5">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center text-xl font-extrabold text-white group hover:text-edu-primary transition">

                    <svg viewBox="0 0 900 900" fill="none" xmlns="http://www.w3.org/2000/svg">

                        <path d="M450 200L250 450L450 700L650 450L450 200Z" fill="#00d9ff" />
                    </svg>
                </div>

            </a>

            <div class="hidden md:flex space-x-8 items-center">

                <a href="#" class="hover:text-edu-primary transition">Challenges</a>
                <a href="profile.html" class="px-6 py-2 bg-edu-secondary text-white font-bold rounded-full hover:scale-105 transition">Start Journey</a>

            <div class="flex flex-col sm:flex-row justify-center gap-4">
