<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register | EduVerse</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                'primary': '#00d9ff',    // Cyan
                'secondary': '#a855f7',  // Violet
                'dark-navy': '#0f172a',  // Deep Space
                'card-bg': '#1e293b',    // Slightly lighter navy
              }
            }
          }
        }
    </script>

    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="profile-styles.css">
</head>

<body class="bg-dark-navy text-slate-200 min-h-screen antialiased font-sans"> 

    <header class="header"> 
        <nav class="nav-bar">
            <a href="index.html" class="nav-logo group text-primary"> 
                <div class="w-8 h-8 bg-primary rounded-full blur-sm absolute opacity-20 group-hover:opacity-40 transition-opacity"></div>
                EduVerse
            </a>

            <div id="nav-links" class="nav-links">
                <a href="profile.html" class="nav-link">Growth Profile</a>
                <a href="features.html" class="nav-link">Core Features</a>
                <a href="challenges.html" class="nav-link">Challenges</a>
            </div>

            <a href="#" class="btn-nav-cta">Start Journey</a>
        </nav>
    </header>
    
    <main class="flex items-center justify-center px-4 py-20 min-h-[90vh]"> 
        <div class="w-full max-w-md">
            <div class="auth-card"> 
                
                <div class="text-center mb-10">
                    <h2 id="auth-header-title" class="text-3xl font-extrabold text-white tracking-tight mb-2"> 
                        Welcome Back!
                    </h2>
                    <p id="auth-header-subtitle" class="text-slate-400">
                        Sign in to access your Digital Growth Profile.
                    </p>
                </div>

                <form id="auth-form" class="space-y-5" action="/api/login" method="POST"> 
                    <div>
                        <label for="email" class="form-label">Email Address</label>
                        <input id="email" name="email" type="email" required class="form-input" placeholder="name@example.com">
                    </div>

                    <div id="password-field-group">
                        <label for="password" class="form-label">Password</label>
                        <input id="password" name="password" type="password" required class="form-input" placeholder="••••••••">
                    </div>
                    
                    <div id="registration-details-group" class="hidden space-y-5">
                        <div>
                            <label for="full-name" class="form-label">Full Name</label>
                            <input id="full-name" name="full-name" type="text" class="form-input" placeholder="John Doe">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label for="grade" class="form-label">Grade</label>
                                <select id="grade" name="grade" class="form-input appearance-none">
                                    <option value="" disabled selected>Select</option>
                                    <option value="9">Class 9</option>
                                    <option value="10">Class 10</option>
                                    <option value="11">Class 11</option>
                                    <option value="12">Class 12</option>
                                </select>
                            </div>
                            <div>
                                <label for="domain" class="form-label">Domain</label>
                                <select id="domain" name="domain" class="form-input appearance-none">
                                    <option value="" disabled selected>Select Path</option>
                                    <option value="coding">Coding</option>
                                    <option value="art">Digital Art</option>
                                    <option value="data">Data Science</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div id="confirm-password-field-group" class="hidden"> 
                        <label for="confirm-password" class="form-label">Confirm Password</label>
                        <input id="confirm-password" name="confirm-password" type="password" class="form-input" placeholder="••••••••"> 
                    </div>

                    <div id="login-options-group" class="flex items-center justify-between text-sm">
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" class="rounded border-slate-700 bg-slate-800 text-primary focus:ring-primary">
                            <span class="ml-2 text-slate-400">Remember me</span>
                        </label>
                        <a href="#" class="text-secondary hover:text-primary transition-colors">Forgot Password?</a>
                    </div>

                    <button id="auth-submit-button" type="submit" class="btn-auth-submit">
                        Sign In
                    </button>
                </form>

                <div class="mt-8 pt-6 border-t border-slate-700/50 text-center">
                    <p class="text-slate-400 text-sm">
                        <span id="auth-toggle-text">New to EduVerse?</span>
                        <a href="#" id="auth-toggle-link" onclick="toggleAuthMode(event)" class="text-primary font-semibold hover:underline ml-1">
                            Create account
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="auth-toggle.js"></script>
</body>
</html>
