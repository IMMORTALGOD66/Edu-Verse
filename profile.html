<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduVerse | Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'space-dark': '#0f1829',
                        'edu-primary': '#00d9ff',
                        'edu-secondary': '#a855f7',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-space-dark text-slate-200">

    <nav class="p-6 border-b border-white/5 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-edu-primary rounded-lg flex items-center justify-center text-space-dark font-black">E</div>
            <span class="font-bold tracking-tighter">EDUVERSE</span>
        </div>
        <button onclick="logout()" class="text-xs text-slate-500 hover:text-red-400 font-bold uppercase tracking-widest">Reset Profile</button>
    </nav>

    <main class="max-w-4xl mx-auto p-6 py-12">
        <header class="mb-12">
            <h1 class="text-4xl font-black mb-2">Welcome back, <span id="user-name" class="text-edu-primary italic">Explorer</span></h1>
            <p class="text-slate-500">Your journey began on <span id="joined-date">...</span></p>
        </header>

        <div class="grid md:grid-cols-2 gap-6">
            
            <div class="bg-white/5 border border-white/10 p-6 rounded-2xl relative overflow-hidden group">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h3 class="text-white font-bold uppercase text-xs tracking-widest mb-1">Self-Discipline</h3>
                        <p class="text-slate-400 text-xs">Focus and Consistency</p>
                    </div>
                    <span id="disc-lvl" class="bg-edu-primary text-space-dark text-[10px] font-black px-2 py-1 rounded">LVL 1</span>
                </div>
                
                <div class="h-2 w-full bg-white/5 rounded-full overflow-hidden mb-4">
                    <div id="disc-fill" class="h-full bg-edu-primary shadow-[0_0_10px_#00d9ff] transition-all duration-700" style="width: 0%"></div>
                </div>

                <button onclick="addXP('discipline', 10)" class="w-full py-2 rounded-xl bg-edu-primary/10 border border-edu-primary/20 text-edu-primary text-xs font-bold hover:bg-edu-primary hover:text-space-dark transition-all">
                    +10 FOCUS XP
                </button>
            </div>

            <div class="bg-white/5 border border-white/10 p-6 rounded-2xl relative overflow-hidden group">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h3 class="text-white font-bold uppercase text-xs tracking-widest mb-1">Resilience</h3>
                        <p class="text-slate-400 text-xs">Overcoming Challenges</p>
                    </div>
                    <span id="res-lvl" class="bg-edu-secondary text-white text-[10px] font-black px-2 py-1 rounded">LVL 1</span>
                </div>
                
                <div class="h-2 w-full bg-white/5 rounded-full overflow-hidden mb-4">
                    <div id="res-fill" class="h-full bg-edu-secondary shadow-[0_0_10px_#a855f7] transition-all duration-700" style="width: 0%"></div>
                </div>

                <button onclick="addXP('resilience', 10)" class="w-full py-2 rounded-xl bg-edu-secondary/10 border border-edu-secondary/20 text-edu-secondary text-xs font-bold hover:bg-edu-secondary hover:text-white transition-all">
                    +10 CHALLENGE XP
                </button>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
