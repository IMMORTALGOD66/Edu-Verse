<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EduVerse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                'primary': '#00d9ff',
                'secondary': '#a855f7',
                'dark-navy': '#050b18', /* Deeper for better contrast */
                'card-bg': '#111827',
              }
            }
          }
        }
    </script>
    <link rel="stylesheet" href="site.css">
    <style>
        /* Essential styles embedded to prevent "invisible" button issue */
        .auth-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .form-input {
            width: 100%;
            background: #050b18;
            border: 1px solid #374151;
            border-radius: 0.5rem;
            padding: 0.6rem 1rem;
            color: white;
            outline: none;
        }
        .form-input:focus { border-color: #00d9ff; }
        
        /* THE VISIBLE BUTTON */
        .btn-auth-submit {
            width: 100%;
            background-color: #00d9ff !important; /* Force Cyan visibility */
            color: #050b18 !important; /* Dark text for contrast */
            font-weight: 800;
            padding: 0.75rem;
            border-radius: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: block;
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-auth-submit:hover {
            background-color: #a855f7 !important;
            color: white !important;
            transform: scale(1.02);
        }
        .hidden { display: none; }
    </style>
</head>

<body class="bg-dark-navy text-slate-300 min-h-screen font-sans flex flex-col">

    <header class="p-4 border-b border-slate-800 bg-dark-navy/50 backdrop-blur-md">
        <nav class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-primary font-black text-xl tracking-tighter">EDUVERSE</a>
            <div class="hidden md:flex gap-6 text-sm font-medium">
                <a href="profile.html" class="hover:text-primary transition">Profile</a>
                <a href="features.html" class="hover:text-primary transition">Features</a>
                <a href="challenges.html" class="hover:text-primary transition">Challenges</a>
            </div>
        </nav>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-sm">
            <div class="auth-card p-6 md:p-8">
                
                <div class="text-center mb-6">
                    <h2 id="auth-header-title" class="text-2xl font-bold text-white mb-1">Welcome Back</h2>
                    <p id="auth-header-subtitle" class="text-slate-500 text-sm">Sign in to your account</p>
                </div>

                <form id="auth-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Email</label>
                        <input id="email" type="email" required class="form-input" placeholder="you@example.com">
                    </div>

                    <div id="password-field-group">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Password</label>
                        <input id="password" type="password" required class="form-input" placeholder="••••••••">
                    </div>

                    <div id="registration-details-group" class="hidden space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Full Name</label>
                            <input id="full-name" type="text" class="form-input" placeholder="Your Name">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Grade</label>
                                <select id="grade" class="form-input">
                                    <option value="9">Class 9</option>
                                    <option value="10">Class 10</option>
                                    <option value="11">Class 11</option>
                                    <option value="12">Class 12</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Path</label>
                                <select id="domain" class="form-input">
                                    <option value="coding">Coding</option>
                                    <option value="art">Design</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div id="confirm-password-field-group" class="hidden">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Confirm</label>
                        <input id="confirm-password" type="password" class="form-input" placeholder="••••••••">
                    </div>

                    <div id="login-options-group" class="flex justify-between items-center text-xs">
                        <label class="flex items-center gap-2">
                            <input type="checkbox" class="accent-primary">
                            <span class="text-slate-500">Remember me</span>
                        </label>
                        <a href="#" class="text-secondary hover:text-primary transition">Forgot?</a>
                    </div>

                    <button id="auth-submit-button" type="submit" class="btn-auth-submit">
                        Sign In
                    </button>
                </form>

                <div class="mt-6 pt-4 border-t border-slate-800 text-center text-xs">
                    <span id="auth-toggle-text" class="text-slate-500">Need an account?</span>
                    <button onclick="toggleAuthMode(event)" id="auth-toggle-link" class="text-primary font-bold ml-1 hover:underline uppercase">
                        Create One
                    </button>
                </div>

            </div>
        </div>
    </main>

    <script>
        let isRegisterMode = false;
        function toggleAuthMode(e) {
            e.preventDefault();
            isRegisterMode = !isRegisterMode;
            
            const elements = {
                title: document.getElementById('auth-header-title'),
                subtitle: document.getElementById('auth-header-subtitle'),
                btn: document.getElementById('auth-submit-button'),
                regGroup: document.getElementById('registration-details-group'),
                confirmGroup: document.getElementById('confirm-password-field-group'),
                options: document.getElementById('login-options-group'),
                toggleText: document.getElementById('auth-toggle-text'),
                toggleLink: document.getElementById('auth-toggle-link')
            };

            if (isRegisterMode) {
                elements.title.innerText = "Join EduVerse";
                elements.subtitle.innerText = "Begin your journey";
                elements.btn.innerText = "Create Account";
                elements.regGroup.classList.remove('hidden');
                elements.confirmGroup.classList.remove('hidden');
                elements.options.classList.add('hidden');
                elements.toggleText.innerText = "Already a member?";
                elements.toggleLink.innerText = "Sign In";
            } else {
                elements.title.innerText = "Welcome Back";
                elements.subtitle.innerText = "Sign in to your account";
                elements.btn.innerText = "Sign In";
                elements.regGroup.classList.add('hidden');
                elements.confirmGroup.classList.add('hidden');
                elements.options.classList.remove('hidden');
                elements.toggleText.innerText = "Need an account?";
                elements.toggleLink.innerText = "Create One";
            }
        }
    </script>
       <script src="script.js"></script>
</body>
</html>
