<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register | EduVerse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        window.tailwind = window.tailwind || {};
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                'primary': '#4f46e5',
                'secondary': '#10b981',
                'light': '#e0e7ff',
                'dark-navy': '#0f1829', 
              }
            }
          }
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="profile-styles.css">
</head>

<body class="min-h-screen antialiased text-gray-800 font-sans"> 

    <header class="header"> 
        <nav class="nav-bar">
            <a href="index.html" class="nav-logo group"> 
                <svg xmlns="http://www.w3.org/2000/svg" class="nav-logo-svg" viewBox="0 0 900 900" fill="none"></svg>
                EduVerse
            </a>

            <button id="mobile-menu-button" class="mobile-menu-button" aria-controls="nav-links" aria-expanded="false" aria-label="Toggle navigation">
                <svg class="mobile-menu-button-svg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>

            <div id="nav-links" class="nav-links">
                <a href="profile.html" class="nav-link active-link">Growth Profile</a>
                <a href="features.html" class="nav-link">Core Features</a>
                <a href="challenges.html" class="nav-link">Challenges</a>
            </div>

            <a href="profile.html" class="btn-nav-cta">
                Start Your Journey
            </a>
        </nav>
        <div id="mobile-menu" class="mobile-nav">
            <div class="mobile-nav-inner">
                <a href="profile.html" class="text-primary font-bold">Growth Profile</a>
                <a href="features.html" class="text-gray-700">Core Features</a>
                <a href="challenges.html" class="block text-gray-700">Challenges</a>
                <a href="profile.html" class="btn-nav-cta" style="display: block; text-align: center;">Start Your Journey</a> 
            </div>
        </div>
    </header>
    
    <main class="flex items-center justify-center py-12 min-h-[calc(100vh-100px)]"> 
        <div class="w-full max-w-md">
            <div class="auth-card p-8 md:p-10"> 
                
                <h2 id="auth-header-title" class="auth-title text-center mb-2"> 
                    Welcome Back!
                </h2>
                <p id="auth-header-subtitle" class="auth-subtitle text-center mb-8">
                    Sign in to access your Digital Growth Profile.
                </p>

                <form id="auth-form" class="space-y-6" action="/api/login" method="POST"> 
                    <div>
                        <label for="email" class="form-label block">Email Address</label>
                        <div class="mt-1">
                            <input id="email" name="email" type="email" autocomplete="email" required class="form-input w-full px-4 py-3">
                        </div>
                    </div>

                    <div id="password-field-group">
                        <label for="password" class="form-label block">Password</label>
                        <div class="mt-1">
                            <input id="password" name="password" type="password" autocomplete="current-password" required class="form-input w-full px-4 py-3">
                        </div>
                    </div>
                    
                    <div id="registration-details-group" class="hidden space-y-6">
                        <div>
                            <label for="full-name" class="form-label block">Full Name</label>
                            <div class="mt-1">
                                <input id="full-name" name="full-name" type="text" autocomplete="name" class="form-input w-full px-4 py-3">
                            </div>
                        </div>
                        
                        <div class="flex space-x-4">
                            <div class="w-1/2">
                                <label for="grade" class="form-label block">Grade/Class</label>
                                <div class="mt-1">
                                    <select id="grade" name="grade" class="form-input w-full px-4 py-3 appearance-none">
                                        <option value="" disabled selected>Select Grade</option>
                                        <option value="9">Class 9</option>
                                        <option value="10">Class 10</option>
                                        <option value="11">Class 11</option>
                                        <option value="12">Class 12</option>
                                    </select>
                                </div>
                            </div>
                            <div class="w-1/2">
                                <label for="domain" class="form-label block">Initial Domain</label>
                                <div class="mt-1">
                                    <select id="domain" name="domain" class="form-input w-full px-4 py-3 appearance-none">
                                        <option value="" disabled selected>Select Path</option>
                                        <option value="coding">Coding & Development</option>
                                        <option value="digital-art">Digital Art & Design</option>
                                        <option value="communication">Communication & Media</option>
                                        <option value="data-skills">Data & Analysis</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="confirm-password-field-group" class="hidden"> 
                        <label for="confirm-password" class="form-label block">Confirm Password</label>
                        <div class="mt-1">
                            <input id="confirm-password" name="confirm-password" type="password" class="form-input w-full px-4 py-3"> 
                        </div>
                    </div>

                    <div id="login-options-group" class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input id="remember-me" name="remember-me" type="checkbox" class="form-checkbox h-4 w-4 border-gray-300 rounded focus:ring-primary">
                            <label for="remember-me" class="ml-2 block text-sm text-gray-900">
                                Remember me
                            </label>
                        </div>

                        <div class="text-sm">
                            <a href="#" class="action-link font-medium transition duration-150">
                                Forgot your password?
                            </a>
                        </div>
                    </div>

                    <div>
                        <button id="auth-submit-button" type="submit" class="btn-auth-submit">
                            Sign In
                        </button>
                    </div>
                </form>

                <div class="mt-6">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center" aria-hidden="true">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="divider-text px-2">
                                Or
                            </span>
                        </div>
                    </div>
                    <p class="mt-6 text-center text-sm text-gray-600">
                        <span id="auth-toggle-text">New to EduVerse?</span>
                        <a href="#" id="auth-toggle-link" onclick="toggleAuthMode(event)" class="action-link font-medium transition duration-150">
                            Create a free account
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="footer">
        <div class="footer-container">
            </div>
    </footer>
    
    <script>
        document.getElementById('mobile-menu-button').addEventListener('click', function() {
            var menu = document.getElementById('mobile-menu');
            menu.classList.toggle('is-open'); 
        });
    </script>

    <script src="auth-toggle.js"></script>

</body>
</html>
