<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduVerse | Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                'primary': '#00d9ff',
                'secondary': '#a855f7',
                'dark-navy': '#050b18',
                'card-bg': '#111827',
              }
            }
          }
        }
    </script>
    <style>
        .auth-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .form-input {
            width: 100%;
            background: #050b18;
            border: 1px solid #374151;
            border-radius: 0.5rem;
            padding: 0.6rem 1rem;
            color: white;
            outline: none;
            font-size: 0.9rem;
        }
        .form-input:focus { border-color: #00d9ff; }
        
        .btn-auth-submit {
            width: 100%;
            background-color: #00d9ff !important;
            color: #050b18 !important;
            font-weight: 800;
            padding: 0.75rem;
            border-radius: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            margin-top: 1rem;
        }
        .btn-auth-submit:hover {
            background-color: #a855f7 !important;
            color: white !important;
            transform: translateY(-2px);
        }
        .hidden { display: none; }
    </style>
</head>

<body class="bg-dark-navy text-slate-300 min-h-screen font-sans flex flex-col">

    <header class="p-4 border-b border-slate-800 bg-dark-navy/50 backdrop-blur-md">
        <nav class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-primary font-black text-xl tracking-tighter">EDUVERSE</a>
            <div class="flex gap-6 text-sm font-medium">
                <a href="index.html" class="hover:text-primary transition">Home</a>
            </div>
        </nav>
    </header>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="w-full max-w-sm">
            <div class="auth-card p-8">
                
                <div class="text-center mb-6">
                    <h2 id="auth-header-title" class="text-2xl font-bold text-white mb-1">Welcome Back</h2>
                    <p id="auth-header-subtitle" class="text-slate-500 text-sm">Continue your journey.</p>
                </div>

                <form id="auth-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Email</label>
                        <input id="email" type="email" required class="form-input" placeholder="name@email.com">
                    </div>

                    <div id="password-field-group">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Password</label>
                        <input id="password" type="password" required class="form-input" placeholder="••••••••">
                    </div>

                    <div id="registration-details-group" class="hidden space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Full Name</label>
                            <input id="full-name" type="text" class="form-input" placeholder="Enter your name">
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Grade / Class</label>
                            <select id="grade" class="form-input">
                                <option value="9">Class 9</option>
                                <option value="10">Class 10</option>
                                <option value="11">Class 11</option>
                                <option value="12">Class 12</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Confirm Password</label>
                            <input id="confirm-password" type="password" class="form-input" placeholder="••••••••">
                        </div>
                    </div>

                    <div id="login-options-group" class="flex justify-between items-center text-xs">
                        <label class="flex items-center gap-2">
                            <input type="checkbox" class="accent-primary">
                            <span class="text-slate-500">Remember me</span>
                        </label>
                        <a href="#" class="text-secondary hover:text-primary transition">Forgot Password?</a>
                    </div>

                    <button id="auth-submit-button" type="submit" class="btn-auth-submit">
                        Sign In
                    </button>
                </form>

                <div class="mt-8 pt-4 border-t border-slate-800 text-center text-xs">
                    <span id="auth-toggle-text" class="text-slate-500">New to EduVerse?</span>
                    <button onclick="toggleAuthMode(event)" id="auth-toggle-link" class="text-primary font-bold ml-1 hover:underline uppercase tracking-wider">
                        Create Account
                    </button>
                </div>

            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
